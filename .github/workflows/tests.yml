name: CI/CD Test Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run unit tests
        env:
          CGO_ENABLED: "1"
        run: |
          packages=$(go list ./... | grep -v '/tests/e2e$')
          go test -race -count=1 $packages

  e2e-tests:
    name: E2E tests
    needs: unit-tests
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: Configure Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Build base image
        run: docker compose build base

      - name: Start services
        env:
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_TEST_MODE: "true"
        run: docker compose up -d --build

      - name: Wait for GraphQL gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/playground > /dev/null; then
              echo "GraphQL gateway is ready"
              exit 0
            fi
            echo "Waiting for services... ($i/60)"
            sleep 10
          done
          echo "GraphQL gateway did not become ready in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Run E2E tests
        run: go test -v -p 1 -shuffle=off -count=1 ./tests/e2e/...

      - name: Stop services
        if: always()
        run: docker compose down -v
