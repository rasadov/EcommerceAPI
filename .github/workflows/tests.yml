name: CI/CD Test Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run unit tests
        env:
          CGO_ENABLED: "1"
        run: |
          packages=$(go list ./... | grep -v '/tests/e2e$')
          go test -race -count=1 $packages

  e2e-tests:
    name: E2E tests
    needs: unit-tests
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: Configure Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Pre-pull images with retry
        run: |
          for image in postgres:14.0 postgres:15 docker.io/apache/kafka:4.1.1; do
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                break
              fi
              echo "Retry $attempt for $image..."
              sleep 15
            done
          done

      - name: Build base image
        run: docker compose build base

      - name: Start services
        env:
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_TEST_MODE: "true"
        run: docker compose up -d --build

      - name: Wait for stack
        run: |
          services="kafka account product order payment graphql"

          for i in $(seq 1 60); do
            if ! curl -sf http://localhost:8080/playground > /dev/null; then
              echo "Waiting for GraphQL gateway... ($i/60)"
              sleep 10
              continue
            fi

            ready=true
            for svc in $services; do
              if [ -z "$(docker compose ps --status running -q "$svc")" ]; then
                echo "Service $svc is not running yet"
                ready=false
                break
              fi
            done

            if [ "$ready" = true ]; then
              break
            fi

            echo "Waiting for backend services... ($i/60)"
            sleep 10
          done

          if ! curl -sf http://localhost:8080/playground > /dev/null; then
            echo "Stack did not become ready in time"
            docker compose ps
            docker compose logs --tail=100 kafka account product order payment graphql
            exit 1
          fi

          echo "Waiting for Elasticsearch..."
          network=$(docker inspect "$(docker compose ps -q graphql)" -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          for i in $(seq 1 30); do
            if docker run --rm --network "$network" curlimages/curl:8.5.0 -sf http://product_db:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'; then
              echo "Elasticsearch is ready"
              break
            fi
            echo "Elasticsearch not ready yet ($i/30)"
            sleep 5
          done

          echo "Waiting for Kafka broker..."
          for i in $(seq 1 30); do
            if docker compose logs kafka 2>&1 | grep -q "Kafka Server started"; then
              echo "Kafka is ready"
              break
            fi
            echo "Kafka not ready yet ($i/30)"
            sleep 5
          done

          echo "Creating Kafka topics before consumers attach..."
          for topic in product_events interaction_events; do
            docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --create \
              --if-not-exists \
              --topic "$topic" \
              --partitions 1 \
              --replication-factor 1
          done

          echo "Restarting Kafka-dependent services so consumers attach to existing topics..."
          docker compose restart payment recommender-sync order product
          sleep 20

          for svc in payment order product; do
            for i in $(seq 1 30); do
              if [ -n "$(docker compose ps --status running -q "$svc")" ]; then
                echo "$svc is running"
                break
              fi
              echo "Waiting for $svc after restart ($i/30)..."
              sleep 5
            done
          done

          echo "Final warmup for gRPC and async pipelines..."
          sleep 30

      - name: Run E2E tests
        env:
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
        run: go test -v -count=1 -run TestE2E ./tests/e2e/...

      - name: Stop services
        if: always()
        run: docker compose down -v
